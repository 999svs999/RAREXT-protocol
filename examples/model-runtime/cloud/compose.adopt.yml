# A control plane that adopts a published model card from RAREXT.
#
# There is no deploy service, no provider probe, and no local deployment file:
# `serve` fetches the latest anchored bundle, recomputes the card, and forwards
# to the endpoint the card commits. The model still lives at the provider; this
# process holds only the ledger and its signing key.
#
#   cp examples/model-runtime/cloud/.env.example examples/model-runtime/cloud/.env
#   # set RAREXT_REGISTRY_URL, RAREXT_DEPLOYMENT, RAREXT_PUBLIC_URL,
#   # RAREXT_GATEWAY_TOKEN, and RAREXT_UPSTREAM_API_KEY
#   docker compose -f examples/model-runtime/cloud/compose.adopt.yml up --build
#
# Add the `tls` profile to terminate HTTPS with Caddy:
#   docker compose -f examples/model-runtime/cloud/compose.adopt.yml --profile tls up --build

services:
  runtime:
    build:
      context: ../../..
      dockerfile: examples/model-runtime/cloud/Dockerfile
    env_file:
      - .env
    volumes:
      - runtime-state:/state
    ports:
      - "8790:8790"
    command:
      - serve
      - --registry
      - ${RAREXT_REGISTRY_URL:?set RAREXT_REGISTRY_URL in .env}
      - --deployment
      - ${RAREXT_DEPLOYMENT:?set RAREXT_DEPLOYMENT to a verified deployment digest or id}
      - --state
      - /state
      - --host
      - 0.0.0.0
      - --port
      - "8790"
      - --public-url
      - ${RAREXT_PUBLIC_URL:?set RAREXT_PUBLIC_URL in .env}
      - --publish
      - --gateway-token-env
      - RAREXT_GATEWAY_TOKEN
      - --upstream-key-env
      - RAREXT_UPSTREAM_API_KEY

  caddy:
    image: caddy:2
    profiles: ["tls"]
    depends_on:
      - runtime
    environment:
      RAREXT_PUBLIC_HOST: ${RAREXT_PUBLIC_HOST:?set RAREXT_PUBLIC_HOST in .env}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  runtime-state:
  caddy-data:
  caddy-config:
