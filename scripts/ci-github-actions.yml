# Template only: copy to .github/workflows/ci.yml once the pushing token has
# the GitHub Actions `workflow` scope. The same steps run via scripts/ci.sh.
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Typecheck, tests, and web build
        run: npm run check
      - name: Contract audit baseline
        run: npm run audit:baseline
      - name: Contract tests
        run: npm run test:contracts
